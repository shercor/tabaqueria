services:
  backend:
    build:
      context: ./backend
    container_name: tabaqueria_backend
    ports:
      - "3000:3000"
    # El resto de variables (JWT_SECRET, EMAIL_*, etc.) vienen de backend/.env
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - BD_HOST=db
      - BD_PORT=3306
      - BD_USER=root
      - BD_PASSWORD=secret
      - BD_NOMBRE=tabaqueria
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Mantiene los node_modules instalados en la imagen (Linux) y no los del equipo
      - /app/node_modules
    # dev:docker usa --legacy-watch para detectar cambios en volúmenes montados desde Windows o macOS
    command: ["sh", "-c", "npm run migrate && npm run dev:docker"]

  db:
    image: mysql:8
    container_name: tabaqueria_db
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: tabaqueria
    ports:
      - "4306:3306"
    volumes:
      - ./db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 30
